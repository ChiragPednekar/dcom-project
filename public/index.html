<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IoTGuard — Error-Resilient IoT Communication</title>
<meta name="description" content="Simulation of Huffman source coding, CRC-8 + ARQ and Hamming(7,4) error control over a Binary Symmetric Channel, for low-power IoT sensor networks." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.1/build/stlite.css" />
<style>
  html, body { margin: 0; padding: 0; background: #0f1115; color: #e6e8eb;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px;
          background: #0f1115; z-index: 9999; text-align: center; padding: 24px; }
  #boot.hidden { display: none; }
  .boot-title { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .boot-sub { font-size: 14px; color: #7d8590; max-width: 460px; line-height: 1.6; }
  .spinner { width: 34px; height: 34px; border: 3px solid #232833;
             border-top-color: #30a46c; border-radius: 50%;
             animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot-note { font-size: 12px; color: #565d68; }
</style>
</head>
<body>
  <div id="boot">
    <div class="spinner"></div>
    <div class="boot-title">📡 IoTGuard</div>
    <div class="boot-sub">
      Starting the Python runtime in your browser. The first load downloads
      Python plus NumPy and Plotly (roughly 15–30 seconds); after that it is
      cached and opens instantly.
    </div>
    <div class="boot-note">Nothing is sent to a server — the whole simulation runs locally.</div>
  </div>

  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.1/build/stlite.js";

    // Pull the real Python modules from the same origin so the browser build
    // runs the identical source as the local app — no duplicated algorithms.
    const MODULES = [
      "app.py", "huffman.py", "error_control.py",
      "channel.py", "pipeline.py", "ui_helpers.py", "make_plots.py",
    ];

    const files = {};
    await Promise.all(MODULES.map(async (name) => {
      const res = await fetch(`./${name}`, { cache: "no-cache" });
      if (!res.ok) throw new Error(`could not load ${name}: ${res.status}`);
      files[name] = await res.text();
    }));

    // Mirror .streamlit/config.toml so the hosted build matches local styling.
    files[".streamlit/config.toml"] = `
[theme]
base = "dark"
primaryColor = "#30a46c"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a21"
textColor = "#e6e8eb"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
`.trim();

    mount(
      {
        entrypoint: "app.py",
        files,
        // matplotlib is deliberately omitted: it is a large wheel and is only
        // used for the PDF/PNG export, which app.py degrades gracefully
        // without. Plotly drives every on-screen chart.
        requirements: ["plotly"],
      },
      document.getElementById("root"),
    );

    // Hide the boot overlay once Streamlit has painted something.
    const root = document.getElementById("root");
    const obs = new MutationObserver(() => {
      if (root.querySelector("[data-testid], .stApp, iframe")) {
        document.getElementById("boot").classList.add("hidden");
        obs.disconnect();
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    setTimeout(() => document.getElementById("boot").classList.add("hidden"), 90000);
  </script>
</body>
</html>
